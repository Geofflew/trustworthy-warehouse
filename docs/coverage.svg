<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="292" viewBox="0 0 1040 292" role="img" aria-labelledby="title desc"><title id="title">Zero and unknown are different</title><desc id="desc">A customer that was measured and had no connections has zero connections. A customer that was not measured has an unknown number, not zero.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#718198"/></marker></defs><rect width="1040" height="292" rx="16" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="44" font-size="26" font-weight="700" fill="#243247">“Nothing found” is different from “we did not look”</text><rect x="28" y="76" width="480" height="150" rx="12" fill="#eaf6f1" stroke="#a7d4c5"/><rect x="532" y="76" width="480" height="150" rx="12" fill="#eef2f9" stroke="#c5d1e3"/><text x="50" y="110" font-size="13" font-weight="700" fill="#12675b">CUSTOMER A</text><text x="50" y="175" font-size="58" font-weight="700" fill="#12675b">0</text><text x="128" y="151" font-size="20" font-weight="400" fill="#243247">We checked for connections.</text><text x="128" y="184" font-size="20" font-weight="400" fill="#243247">We found none.</text><text x="554" y="110" font-size="13" font-weight="700" fill="#52647c">CUSTOMER B</text><text x="554" y="175" font-size="58" font-weight="700" fill="#52647c">?</text><text x="632" y="151" font-size="20" font-weight="400" fill="#243247">We have no measurements.</text><text x="632" y="184" font-size="20" font-weight="400" fill="#243247">The count is unknown.</text><text x="28" y="265" font-size="20" font-weight="700" fill="#243247">Only report zero when the source actually covered that customer.</text></g></svg>
