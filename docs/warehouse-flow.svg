<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="840" viewBox="0 0 1080 840" role="img" aria-labelledby="title desc"><title id="title">Our answer: organize the data and check its meaning</title><desc id="desc">Define shared meaning through bronze, silver and semantic views. Preserve meaning with coverage definitions and separate query checks for repeated values and lost customers. Make failures actionable: only freshness and date-order checks feed the findings workflow. A finding with a registered fix can be approved, applied and rechecked in a transaction; other findings require investigation upstream.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#718198"/></marker></defs><rect width="1080" height="840" rx="16" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="42" font-size="26" fill="#14243a" font-weight="700">Our answer: organize the data and check its meaning</text><text x="28" y="76" font-size="17" fill="#52647c" font-weight="400">Synthetic stand-ins for separate source systems</text><rect x="28" y="94" width="1024" height="48" rx="10" fill="#fff" stroke="#ccd7e4"/><text x="46" y="124" font-size="18" fill="#243247" font-weight="400">Account &amp; deal records</text><text x="404" y="124" font-size="18" fill="#243247" font-weight="400">Contracts &amp; invoices</text><text x="762" y="124" font-size="18" fill="#243247" font-weight="400">Product activity records</text><path d="M182 148V184" fill="none" stroke="#718198" stroke-width="2" marker-end="url(#arrow)"/><text x="198" y="171" font-size="16" fill="#52647c" font-weight="400">loaded into</text><rect x="28" y="200" width="308" height="110" rx="10" fill="#fbefe4" stroke="#ccd7e4"/><text x="44" y="228" font-size="13" fill="#52647c" font-weight="700">BRONZE</text><text x="44" y="262" font-size="22" fill="#14243a" font-weight="700">Source records</text><text x="44" y="289" font-size="17" fill="#243247" font-weight="400">Keep the source inputs.</text><rect x="386" y="200" width="308" height="110" rx="10" fill="#eef2f6" stroke="#ccd7e4"/><text x="402" y="228" font-size="13" fill="#52647c" font-weight="700">SILVER</text><text x="402" y="262" font-size="22" fill="#14243a" font-weight="700">Shared definitions</text><text x="402" y="289" font-size="17" fill="#243247" font-weight="400">Dates, coverage, activity.</text><rect x="744" y="200" width="308" height="110" rx="10" fill="#fff5d9" stroke="#ccd7e4"/><text x="760" y="228" font-size="13" fill="#52647c" font-weight="700">SEMANTIC / GOLD</text><text x="760" y="262" font-size="22" fill="#14243a" font-weight="700">Business-facing views</text><text x="760" y="289" font-size="17" fill="#243247" font-weight="400">Accounts, onboarding, contracts.</text><path d="M342 254H378" fill="none" stroke="#718198" stroke-width="2" marker-end="url(#arrow)"/><text x="340" y="242" font-size="13" fill="#52647c" font-weight="400">derive</text><path d="M700 254H736" fill="none" stroke="#718198" stroke-width="2" marker-end="url(#arrow)"/><text x="697" y="242" font-size="13" fill="#52647c" font-weight="400">expose</text><text x="28" y="337" font-size="16" fill="#52647c" font-weight="400">Some semantic views expose bronze directly. Arrows above show the main data path.</text><text x="28" y="380" font-size="19" fill="#14243a" font-weight="700">Three design principles behind trustworthy answers</text><rect x="28" y="400" width="308" height="142" rx="10" fill="#eaf6f1" stroke="#a7d4c5"/><text x="44" y="431" font-size="21" fill="#12675b" font-weight="700">Define shared meaning</text><text x="44" y="466" font-size="16" fill="#243247" font-weight="400">Define dates and source coverage;</text><text x="44" y="493" font-size="16" fill="#243247" font-weight="400">carry that meaning into views.</text><text x="44" y="520" font-size="16" fill="#243247" font-weight="400">Unknown stays different from 0.</text><rect x="386" y="400" width="308" height="142" rx="10" fill="#eaf6f1" stroke="#a7d4c5"/><text x="402" y="431" font-size="21" fill="#12675b" font-weight="700">Preserve meaning</text><text x="402" y="466" font-size="16" fill="#243247" font-weight="400">Declared joins: repeated values?</text><text x="402" y="493" font-size="16" fill="#243247" font-weight="400">Query steps: missing customers?</text><text x="402" y="520" font-size="16" fill="#243247" font-weight="400">Report or refuse unsafe results.</text><rect x="744" y="400" width="308" height="142" rx="10" fill="#eaf6f1" stroke="#a7d4c5"/><text x="760" y="431" font-size="21" fill="#12675b" font-weight="700">Make failures actionable</text><text x="760" y="466" font-size="16" fill="#243247" font-weight="400">Freshness: inspect bronze dates.</text><text x="760" y="493" font-size="16" fill="#243247" font-weight="400">Date order: inspect semantic views.</text><text x="760" y="520" font-size="16" fill="#243247" font-weight="400">Record failures for investigation.</text><path d="M898 548V566H182V602" fill="none" stroke="#718198" stroke-width="2" marker-end="url(#arrow)"/><text x="350" y="590" font-size="16" fill="#52647c" font-weight="400">Freshness + date-order failures</text><rect x="28" y="616" width="308" height="110" rx="10" fill="#fff" stroke="#ccd7e4"/><text x="44" y="648" font-size="20" fill="#14243a" font-weight="700">One open finding per check</text><text x="44" y="682" font-size="16" fill="#243247" font-weight="400">Repeated failures stay one task.</text><path d="M342 671H378" fill="none" stroke="#718198" stroke-width="2" marker-end="url(#arrow)"/><text x="337" y="655" font-size="13" fill="#52647c" font-weight="400">fix exists</text><rect x="386" y="616" width="308" height="110" rx="10" fill="#fff" stroke="#ccd7e4"/><text x="402" y="648" font-size="20" fill="#14243a" font-weight="700">A person approves the fix</text><text x="402" y="682" font-size="16" fill="#243247" font-weight="400">Demo: onboarding date correction.</text><path d="M700 671H736" fill="none" stroke="#718198" stroke-width="2" marker-end="url(#arrow)"/><text x="697" y="655" font-size="13" fill="#52647c" font-weight="400">approve</text><rect x="744" y="616" width="308" height="110" rx="10" fill="#fff" stroke="#ccd7e4"/><text x="760" y="648" font-size="18" fill="#14243a" font-weight="700">Apply + recheck in a transaction</text><text x="760" y="682" font-size="16" fill="#243247" font-weight="400">Pass: commit. Fail: roll back.</text><path d="M182 732V762" fill="none" stroke="#718198" stroke-width="2" marker-end="url(#arrow)"/><text x="198" y="752" font-size="16" fill="#52647c" font-weight="400">no registered fix</text><text x="28" y="792" font-size="17" fill="#52647c" font-weight="400">Investigate upstream; approval cannot apply a local fix.</text></g></svg>
