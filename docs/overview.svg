<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="394" viewBox="0 0 1040 394" role="img" aria-labelledby="title desc"><title id="title">One contract, counted twice</title><desc id="desc">A contract worth $100 is matched with two line items. Its $100 value appears in both rows. Adding the rows gives $200, although the contract is still worth $100.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#718198"/></marker></defs><rect width="1040" height="394" rx="16" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif"><text x="28" y="44" font-size="26" font-weight="700" fill="#243247">Adding detail can accidentally double the total</text><text x="28" y="90" font-size="13" font-weight="700" fill="#52647c">THE ORIGINAL</text><text x="348" y="90" font-size="13" font-weight="700" fill="#52647c">AFTER MATCHING TWO LINE ITEMS</text><text x="828" y="90" font-size="13" font-weight="700" fill="#a23d29">WRONG TOTAL</text><rect x="28" y="112" width="250" height="158" rx="12" fill="#fff" stroke="#ccd7e4"/><text x="50" y="149" font-size="22" font-weight="700" fill="#243247">Contract A</text><text x="50" y="207" font-size="46" font-weight="700" fill="#243247">$100</text><text x="50" y="244" font-size="17" font-weight="400" fill="#243247">One contract. One value.</text><path d="M290 190H328" stroke="#718198" stroke-width="2" marker-end="url(#arrow)"/><rect x="348" y="112" width="430" height="158" rx="10" fill="#fff" stroke="#ccd7e4"/><path d="M348 158H778 M348 214H778" stroke="#dce3eb"/><text x="366" y="141" font-size="16" font-weight="700" fill="#243247">Contract</text><text x="520" y="141" font-size="16" font-weight="700" fill="#243247">Line item</text><text x="668" y="141" font-size="16" font-weight="700" fill="#243247">Value</text><text x="366" y="193" font-size="20" font-weight="400" fill="#243247">A</text><text x="520" y="193" font-size="20" font-weight="400" fill="#243247">Item 1</text><text x="668" y="193" font-size="22" font-weight="700" fill="#a23d29">$100</text><text x="366" y="248" font-size="20" font-weight="400" fill="#243247">A</text><text x="520" y="248" font-size="20" font-weight="400" fill="#243247">Item 2</text><text x="668" y="248" font-size="22" font-weight="700" fill="#a23d29">$100</text><path d="M790 190H816" stroke="#718198" stroke-width="2" marker-end="url(#arrow)"/><text x="828" y="198" font-size="46" font-weight="700" fill="#a23d29">$200</text><text x="828" y="235" font-size="17" font-weight="400" fill="#243247">Same value</text><text x="828" y="258" font-size="17" font-weight="400" fill="#243247">added twice.</text><rect x="28" y="300" width="984" height="66" rx="10" fill="#eaf6f1"/><text x="48" y="340" font-size="22" font-weight="700" fill="#12675b">The contract is still worth $100. Two matching rows do not create extra value.</text></g></svg>
